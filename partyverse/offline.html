<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0f1a" />
  <title>PartyVerse — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0f1a;
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
    h1 span { color: #7c3aed; }
    p { color: #94a3b8; max-width: 320px; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #7c3aed; color: #fff;
      border: none; border-radius: 12px;
      padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s, transform 0.15s;
    }
    .btn:active { transform: scale(0.97); background: #6d28d9; }
    .note {
      margin-top: 2rem; font-size: 0.8rem; color: #475569;
      max-width: 300px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Party<span>Verse</span></h1>
  <p>You're offline. PartyVerse needs one successful online visit to cache all game files for offline play.</p>
  <a href="." class="btn">↩ Try Again</a>
  <p class="note">Once you've loaded the app online at least once, you'll be able to play all games without an internet connection.</p>
</body>
</html>
